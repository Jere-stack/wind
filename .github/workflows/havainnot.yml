# Havaintovarasto: Espoo Haukilahden (Surfing ry, Mellsten) ja Larun
# (Lauttasaari) historia.
#
# Lähde antaa kuluvalta vuorokaudelta tekstinä vain 30 tuoreinta
# minuuttia, ja päivän arkisto ilmestyy vasta kun vuorokausi on ohi —
# joskus ei lainkaan (10.9.2026 klo 11:40–23:59 jäi arkistosta pois,
# koska seuraava istunto sai saman tiedostonimen). Windgurun asemalla
# 2399 on sama asema koko historioineen, koska Windguru kerää sen itse.
# Tämä tekee saman: joka ajolla 30 minuutin tekstirivit ja lähteen
# neljän tunnin kuvaaja (plot.gif, luetaan minuuttiriveiksi) varastoon,
# ja tunnin välein lähteen arkisto päälle (tools/havainnot.mjs,
# docs/data.md "Mellstenin historia omaan varastoon" ja "Katkot pois").
#
# Samassa ajossa Larun (Lauttasaari) päättyneet päivät (tools/laru.mjs,
# docs/data.md "Larun historia"): lähde pitää ne itse, joten varasto on
# proxyn välimuisti ja varmuuskopio, ei historian ainoa lähde.
#
# Ja kelikameroiden tila (tools/kamerat.mjs): kaksi näytettä eri aikaan
# on ainoa tapa nähdä päivittyykö kameran kuva (docs/data.md "Larun
# kelikamera").
#
# ORPO HAARA JA PAKKOPÄIVITYS kuten `saadata`: haarassa on aina tasan
# yksi committi, joten satakin ajoa vuorokaudessa ei kasvata repoa.
# Varasto on noin 3,6 MB (31 vrk: Mellsten 2,4 MB minuutin riveinä,
# Laru 1,2 MB).
#
# KOLME HERÄTINTÄ, KOSKA GITHUBIN AJASTIN EI RIITÄ — MITATTU. Tämän
# työnkulun ajastin ei käynnistänyt yhtään ajoa kuuteen tuntiin (29.9.
# klo 07:59–14:00 UTC, ~36 vuoroa), ja Säädatan ajastin laukeaa 4–11
# tunnin välein. Kuvaaja kattaa neljä tuntia, joten riittää että ajo
# osuu alle neljän tunnin välein:
#
#   schedule       jää varalle; laukeaa jos laukeaa
#   workflow_run   jokaisen Säädata-ajon perään (sen ajastin toimii)
#   lenkki         AJASTINKETJU (tools/ajastin.mjs): kun ympäristölle
#                  `ajastin` on asetettu odotusajastin (Settings →
#                  Environments → ajastin → Wait timer, esim. 20 min),
#                  jokainen ajo lähettää seuraavan, joka odottaa ajastimen
#                  verran ILMAN konetta. Ilman ajastinta ketju ei käynnisty.
#
# Ulkoinen herätin (`workflow_dispatch` esim. cron-job.orgista) toimii
# yhä, ks. docs/data.md.
#
# Julkisessa repossa Actions-minuutit ovat rajattomat. Ajo ei asenna
# riippuvuuksia (vain Noden omat moduulit), joten se kestää sekunteja.

name: Havainnot

on:
  schedule:
    # Ei tasatunnille: GitHubin ajastin on silloin kuormitetuin.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      lenkki:
        description: 'Ajastinketjun lenkki (lähetyshetki, ms). Tyhjä = kerää heti.'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: [Säädata]
    types: [completed]

# Ajot jonoon, ei peruutusta: kaksi samanaikaista pakkopäivitystä
# hävittäisi toisen ajon rivit.
concurrency:
  group: havainnot
  cancel-in-progress: false

permissions:
  contents: write
  # Ajastinketju: seuraavan lenkin lähetys (workflow_dispatch) ja ajojen
  # ja ympäristön luku (tools/ajastin.mjs).
  actions: write

jobs:
  # Vain ajastinketjun lenkki odottaa. Ympäristön odotusajastin pitää
  # työn jonossa ilman konetta; muut ajot (ajastin, Säädatan perään,
  # käsin ilman syötettä) ohittavat tämän ja keräävät heti.
  odota:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lenkki != '' }}
    runs-on: ubuntu-latest
    environment: ajastin
    steps:
      - run: echo "Ajastinketjun lenkki odotti ympäristön ajastimen verran."

  keraa:
    needs: odota
    if: ${{ !cancelled() && needs.odota.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # EDELLINEN VARASTO ON NOUDETTAVA, EI OLETETTAVA. Jos haku
      # epäonnistuisi hiljaa ja ajo jatkaisi tyhjästä, pakkopäivitys
      # pyyhkisi kuluvan päivän kerätyt rivit — ne joita lähteessä ei
      # ole. Siksi tyhjästä aloitetaan VAIN kun haaraa ei ole
      # (`ls-remote --exit-code` = 2); muu virhe kaataa ajon.
      - name: Nouda varasto
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          set +e
          git ls-remote --exit-code --heads "$URL" havainnot > /dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch havainnot "$URL" varasto
            rm -rf varasto/.git
          elif [ "$rc" -eq 2 ]; then
            echo "Haaraa havainnot ei vielä ole — aloitetaan tyhjästä (arkisto täyttää historian)."
            mkdir -p varasto
          else
            exit "$rc"
          fi

      - name: Kerää
        run: node tools/havainnot.mjs varasto >> "$GITHUB_STEP_SUMMARY"

      # Larun päättyneet päivät (tools/laru.mjs). Oma askel, oma
      # aikaraja ja `continue-on-error`: Larun vika tai jumittunut lähde
      # ei saa estää Mellstenin rivien julkaisua. Väliin jäänyt päivä ei
      # katoa — se on lähteessä ja haetaan seuraavalla ajolla.
      - name: Laru
        continue-on-error: true
        timeout-minutes: 3
        run: node tools/laru.mjs varasto >> "$GITHUB_STEP_SUMMARY"

      # Kelikameroiden tila (tools/kamerat.mjs, api/_kamerat.js): onko
      # pikkukuva vaihtunut edellisen käynnin jälkeen. YouTuben
      # live-lippu ei kerro sitä, ja proxy näkee vain yhden hetken.
      # `continue-on-error`: kameran vika ei saa estää Mellstenin rivien
      # julkaisua samassa ajossa.
      - name: Kelikamerat
        continue-on-error: true
        run: node tools/kamerat.mjs varasto >> "$GITHUB_STEP_SUMMARY"

      - name: Julkaise haaraan havainnot
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          set -e
          test -f varasto/mellsten/tila.json
          # Vercel lukee vercel.json:n siitä haarasta jota se deployaa;
          # ilman tätä se yrittäisi rakentaa tämän haaran joka ajolla
          # (ks. saadata.yml).
          printf '%s\n' '{ "git": { "deploymentEnabled": { "havainnot": false } } }' > varasto/vercel.json
          cd varasto
          git init -q
          git checkout -q --orphan havainnot
          git add -A
          git -c user.name='FoilSpot data' \
              -c user.email='data@foilspot.invalid' \
              commit -q -m "Havainnot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "$URL" havainnot

      # Viimeisenä ja myös epäonnistuneen keruun jälkeen: ketju ei saa
      # katketa siihen että lähde oli hetken alhaalla. Skripti ei kaada
      # ajoa, ja ilman ympäristön odotusajastinta se ei tee mitään.
      - name: Ajastinketju
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          LENKKI: ${{ inputs.lenkki }}
        run: node tools/ajastin.mjs >> "$GITHUB_STEP_SUMMARY"
