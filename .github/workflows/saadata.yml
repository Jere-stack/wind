# Säälaattojen päivitys.
#
# Lukee Open-Meteon avoimen datan AWS Open Datasta ja julkaisee siitä
# laatat haaraan `saadata`, josta sovellus lataa ne suoraan
# raw.githubusercontent.comin kautta (CORS on siellä auki ja välimuisti
# 5 minuuttia — juuri sopiva kolmen tunnin välein päivittyvälle datalle).
#
# MIKSI ORVOKSI JA PAKOLLA. Laatat ovat noin 106 MB kierrokselta
# (mitattu 23.9.2026: ECMWF 28 MB, FMI HARMONIE 14 MB, MET Nordic 65 MB;
# ks. docs/mallit.md). Jos ne kasautuisivat historiaan, repo kasvaisi
# 420 MB vuorokaudessa. `git checkout --orphan` + `push --force`
# tarkoittaa että haarassa on aina täsmälleen yksi committi: nykyinen
# tilanne, ei mitään muuta. GitHub siivoaa pudotetut versiot: kuukauden
# neljästi päivässä pakkopäivitetyn varaston jälkeen repon koko oli
# 31,8 MB.
#
# Julkisessa reposessa Actions-minuutit ovat rajattomat, joten tämä on
# ilmaista. Ajo kestää noin kymmenen minuuttia (mitattu kontissa 622 s):
# ECMWF noin neljä, FMI:n HARMONIE-hila kahdesta ajosta noin kaksi
# (55 MB GRIB2:ta) ja MET Nordic noin neljä (104 tuntia, 7 MB tiedostoa
# kohti joista luetaan kolme kenttää). Muistia kuluu enimmillään 0,85 GB.

name: Säädata

on:
  schedule:
    # Neljä kertaa vuorokaudessa, noin tunti ECMWF:n ajojen jälkeen.
    # ECMWF ajaa 00/06/12/18 UTC ja data ilmestyy S3:een muutaman tunnin
    # viiveellä; työ etsii itse uusimman valmiin ajon, joten tarkka
    # kellonaika ei ole kriittinen.
    - cron: '20 4,10,16,22 * * *'
  workflow_dispatch:

concurrency:
  group: saadata
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  laatat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rakenna laatat
        env:
          RINNAKKAIN: '8'
          MENNEISYYS_H: '48'
        run: node tools/tiilet.mjs ulos

      - name: Julkaise haaraan saadata
        run: |
          set -e
          test -f ulos/luettelo.json
          # ÄLÄ ANNA VERCELIN DEPLOYATA TÄTÄ HAARAA.
          #
          # Vercel lukee `vercel.json`:n SIITÄ haarasta jota se on
          # deployaamassa. Tämä on orpo haara jossa on vain laattoja,
          # joten juuren `vercel.json` — jossa tämä sama asetus jo on —
          # ei päde tänne lainkaan.
          #
          # Ilman tätä riviä Vercel kloonaa haaran, ei löydä
          # `package.json`:ia, ajaa projektin oletusbuildin (`vite build`)
          # ja kaatuu koodiin 127. Neljästi vuorokaudessa, joka
          # laattapäivityksellä. Tuotanto ei kärsi — se tulee
          # oletushaarasta — mutta ilmoitus tulee.
          printf '%s\n' '{ "git": { "deploymentEnabled": { "saadata": false } } }' > ulos/vercel.json
          cd ulos
          git init -q
          git checkout -q --orphan saadata
          git add -A
          git -c user.name='FoilSpot data' \
              -c user.email='data@foilspot.invalid' \
              commit -q -m "Säälaatat $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            saadata

      - name: Yhteenveto
        run: |
          {
            echo '### Säälaatat päivitetty'
            echo ''
            node -e '
              const l = require("./ulos/luettelo.json");
              const mb = require("fs").readdirSync("ulos", {recursive:true})
                .filter(f => f.endsWith(".gz"))
                .reduce((s,f) => s + require("fs").statSync("ulos/"+f).size, 0) / 1e6;
              console.log("| | |");
              console.log("|---|---|");
              console.log("| Malli | " + l.malli + " |");
              console.log("| Ajo | " + l.ajoAika + " |");
              console.log("| Aika-askelia | " + l.nt + " |");
              console.log("| Jakso | " + new Date(l.ajat[0]).toISOString() + " … " + new Date(l.ajat[l.ajat.length-1]).toISOString() + " |");
              console.log("| Laattoja | " + l.tasot.reduce((s,t)=>s+t.laatat.length,0) + " |");
              const h = l.tasot.find(t => t.id === "h0");
              console.log("| HARMONIE | " + (h
                ? h.laatat.length + " laattaa, " + h.nt + " tuntia, "
                  + new Date(h.ajat[0]).toISOString() + " … "
                  + new Date(h.ajat[h.nt-1]).toISOString()
                : "EI MUKANA") + " |");
              const n0 = (l.lisatasot || []).find(t => t.id === "n0");
              console.log("| MET Nordic | " + (n0
                ? n0.laatat.length + " laattaa (n0), " + n0.nt + " tuntia, "
                  + new Date(n0.ajat[0]).toISOString() + " … "
                  + new Date(n0.ajat[n0.nt-1]).toISOString()
                : "EI MUKANA") + " |");
              console.log("| Lisätasot | " + (l.lisatasot || []).map(t => t.id + " " + t.laatat.length).join(", ") + " |");
              console.log("| Koko | " + mb.toFixed(1) + " MB |");
              console.log("| Puuttuvia hetkiä | " + l.puuttuvia + " |");
            '
          } >> "$GITHUB_STEP_SUMMARY"
