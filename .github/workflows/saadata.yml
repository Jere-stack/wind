# Säälaattojen päivitys.
#
# Lukee Open-Meteon avoimen datan AWS Open Datasta ja julkaisee siitä
# laatat haaraan `saadata`, josta sovellus lataa ne suoraan
# raw.githubusercontent.comin kautta (CORS on siellä auki ja välimuisti
# 5 minuuttia — juuri sopiva kolmen tunnin välein päivittyvälle datalle).
#
# MIKSI ORVOKSI JA PAKOLLA. Laatat ovat noin 267 MB kierrokselta
# (mitattu 4.10.2026: ECMWF 40 MB, FMI HARMONIE 13 MB, MET Nordic 46 MB,
# Euroopan kymmenen alueellista mallia 163 MB, aallot 6 MB; ks.
# docs/eurooppa.md, luku 12). Ennen Eurooppaa 106 MB. Jos ne kasautuisivat
# historiaan, repo kasvaisi gigatavun vuorokaudessa. `git checkout --orphan` + `push --force`
# tarkoittaa että haarassa on aina täsmälleen yksi committi: nykyinen
# tilanne, ei mitään muuta. GitHub siivoaa pudotetut versiot: kuukauden
# neljästi päivässä pakkopäivitetyn varaston jälkeen repon koko oli
# 31,8 MB.
#
# Julkisessa reposessa Actions-minuutit ovat rajattomat, joten tämä on
# ilmaista. Ajo kestää noin 26 minuuttia (mitattu kontissa 1 550 s
# 4.10.2026): ECMWF noin neljä, FMI:n HARMONIE-hila kahdesta ajosta noin
# kaksi (55 MB GRIB2:ta), MET Nordic noin viisi (105 tuntia) ja Euroopan
# alueelliset mallit 13,4 (805 s; AROME 160 s, DINI 185 s, ALADIN CE
# 116 s, UKV 109 s). Muistia kuluu enimmillään 1,31 GB (ennen 0,85).
# Aikaraja on 60 min: 45 min jätti Euroopan jälkeen vain 19 min varaa
# hitaalle S3-päivälle, ja aikakatkaisu menettäisi koko rakennuksen.

name: Säädata

on:
  schedule:
    # Neljä kertaa vuorokaudessa, noin tunti ECMWF:n ajojen jälkeen.
    # ECMWF ajaa 00/06/12/18 UTC ja data ilmestyy S3:een muutaman tunnin
    # viiveellä; työ etsii itse uusimman valmiin ajon, joten tarkka
    # kellonaika ei ole kriittinen.
    #
    # AJASTIN ON VARALLA (docs/oikeellisuus.md, O1). Se myöhästyi
    # 22.–29.9.2026 mediaanina 3,7 h (enintään 5,7 h), ja varasto jäi
    # FMI:stä 1–3 ajoa jälkeen. Varsinainen herätin on Havainnot-ajon
    # askel `tools/saaherate.mjs`, joka lähettää tämän (workflow_dispatch)
    # kun FMI:llä on varastoa uudempi ajo.
    - cron: '20 4,10,16,22 * * *'
  workflow_dispatch:

# EI PERUUTUSTA: herätin ja ajastin voivat osua päällekkäin, ja
# `cancel-in-progress: true` peruisi melkein valmiin rakennuksen uuden
# alkaessa. Nyt uusi odottaa jonossa (GitHub pitää ryhmässä yhden
# odottavan), ja herätin ei lähetä mitään kun ajo on jo jonossa tai
# käynnissä.
concurrency:
  group: saadata
  cancel-in-progress: false

permissions:
  contents: write
  # GitHub Pages -julkaisu (docs/julkaisu.md, L3).
  pages: write
  id-token: write

jobs:
  laatat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rakenna laatat
        env:
          RINNAKKAIN: '8'
          MENNEISYYS_H: '48'
        run: node tools/tiilet.mjs ulos

      - name: Julkaise haaraan saadata
        run: |
          set -e
          test -f ulos/luettelo.json
          # ÄLÄ ANNA VERCELIN DEPLOYATA TÄTÄ HAARAA.
          #
          # Vercel lukee `vercel.json`:n SIITÄ haarasta jota se on
          # deployaamassa. Tämä on orpo haara jossa on vain laattoja,
          # joten juuren `vercel.json` — jossa tämä sama asetus jo on —
          # ei päde tänne lainkaan.
          #
          # Ilman tätä riviä Vercel kloonaa haaran, ei löydä
          # `package.json`:ia, ajaa projektin oletusbuildin (`vite build`)
          # ja kaatuu koodiin 127. Neljästi vuorokaudessa, joka
          # laattapäivityksellä. Tuotanto ei kärsi — se tulee
          # oletushaarasta — mutta ilmoitus tulee.
          printf '%s\n' '{ "git": { "deploymentEnabled": { "saadata": false } } }' > ulos/vercel.json
          cd ulos
          git init -q
          git checkout -q --orphan saadata
          git add -A
          git -c user.name='FoilSpot data' \
              -c user.email='data@foilspot.invalid' \
              commit -q -m "Säälaatat $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            saadata

      # GITHUB PAGES ON ENSISIJAINEN KOTI (docs/julkaisu.md, L3).
      #
      # raw.githubusercontent.com ei ole CDN: ei palvelutasoa, ja GitHub
      # rajoittaa sitä. Pages tarjoilee saman hakemiston Fastlyn kautta,
      # ja sovellus hakee luettelon ensin sieltä ja putoaa rawiin vain jos
      # Pages ei vastaa tuoreella varastolla. Haara `saadata` pysyy siis
      # varatienä ja historian korvikkeena.
      #
      # `continue-on-error`: Pages on kytkettävä päälle kerran käsin
      # (Settings → Pages → Source: GitHub Actions). Ennen sitä julkaisu
      # epäonnistuu, eikä sen saa kaataa laattapäivitystä.
      - name: Pagesin paketti
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ulos

      - name: Julkaise GitHub Pagesiin
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Yhteenveto
        run: |
          {
            echo '### Säälaatat päivitetty'
            echo ''
            node -e '
              const l = require("./ulos/luettelo.json");
              const mb = require("fs").readdirSync("ulos", {recursive:true})
                .filter(f => f.endsWith(".gz"))
                .reduce((s,f) => s + require("fs").statSync("ulos/"+f).size, 0) / 1e6;
              console.log("| | |");
              console.log("|---|---|");
              console.log("| Malli | " + l.malli + " |");
              console.log("| Ajo | " + l.ajoAika + " |");
              console.log("| Aika-askelia | " + l.nt + " |");
              console.log("| Jakso | " + new Date(l.ajat[0]).toISOString() + " … " + new Date(l.ajat[l.ajat.length-1]).toISOString() + " |");
              console.log("| Laattoja | " + l.tasot.reduce((s,t)=>s+t.laatat.length,0) + " |");
              const h = l.tasot.find(t => t.id === "h0");
              console.log("| HARMONIE | " + (h
                ? h.laatat.length + " laattaa, " + h.nt + " tuntia, "
                  + new Date(h.ajat[0]).toISOString() + " … "
                  + new Date(h.ajat[h.nt-1]).toISOString()
                : "EI MUKANA") + " |");
              const n0 = (l.lisatasot || []).find(t => t.id === "n0");
              console.log("| MET Nordic | " + (n0
                ? n0.laatat.length + " laattaa (n0), " + n0.nt + " tuntia, "
                  + new Date(n0.ajat[0]).toISOString() + " … "
                  + new Date(n0.ajat[n0.nt-1]).toISOString()
                : "EI MUKANA") + " |");
              for (const p of (l.perheet || [])) {
                if (["fmi", "metnordic", "ecmwf"].includes(p)) continue;
                const t0 = (l.lisatasot || []).filter(t => t.perhe === p).sort((a, b) => a.askel - b.askel)[0];
                console.log("| " + p + " | " + (t0
                  ? t0.laatat.length + " laattaa (" + t0.id + "), " + t0.nt + " tuntia, "
                    + new Date(t0.ajat[0]).toISOString() + " … " + new Date(t0.ajat[t0.nt-1]).toISOString()
                  : "EI MUKANA") + " |");
              }
              console.log("| Lisätasot | " + (l.lisatasot || []).map(t => t.id + " " + t.laatat.length).join(", ") + " |");
              const a = l.aallot;
              console.log("| Aallot (WAM) | " + (a
                ? a.tasot.map(t => t.id + " " + t.laatat.length).join(", ") + ", " + a.nt + " tuntia, "
                  + new Date(a.ajat[0]).toISOString() + " … " + new Date(a.ajat[a.nt-1]).toISOString()
                : "EI MUKANA") + " |");
              console.log("| Koko | " + mb.toFixed(1) + " MB |");
              console.log("| Puuttuvia hetkiä | " + l.puuttuvia + " |");
            '
            echo ''
            echo "Pages: ${{ steps.pages.outcome }} ${{ steps.pages.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
